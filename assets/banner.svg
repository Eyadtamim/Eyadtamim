<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Eyad Tamim - UI/UX Designer and MEAN Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#1b1f4b"/>
      <stop offset="100%" stop-color="#4a1d7a"/>
      <animate attributeName="x2" values="1;0.7;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9ecbff"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="240" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="url(#bg)"/>

    <!-- floating glow dots -->
    <circle cx="120" cy="60" r="3" fill="#58a6ff" opacity="0.6">
      <animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="80" r="4" fill="#d2a8ff" opacity="0.6">
      <animate attributeName="cy" values="80;55;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="40" r="2.5" fill="#7ee787" opacity="0.6">
      <animate attributeName="cy" values="40;25;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="35" r="2.5" fill="#ffffff" opacity="0.5">
      <animate attributeName="cy" values="35;20;35" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Title -->
    <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="500" y="108" font-size="62" font-weight="700" fill="url(#title)" opacity="0">
        Eyad Tamim
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="1.2s" fill="freeze"/>
      </text>
      <text x="500" y="152" font-size="22" font-weight="500" fill="#c9d1d9" opacity="0">
        UI/UX Designer &amp; MEAN Stack Developer
        <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.6s" dur="1.2s" fill="freeze"/>
      </text>
    </g>

    <!-- Animated waves -->
    <path fill="#58a6ff" fill-opacity="0.18"
          d="M0,175 q125,-40 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="#d2a8ff" fill-opacity="0.20"
          d="M0,195 q125,35 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#0d1117" fill-opacity="0.85"
          d="M0,213 q125,-25 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
